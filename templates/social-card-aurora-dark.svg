<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="126" viewBox="0 0 860 126" role="img" aria-label="Social card">
  <defs>
    <linearGradient id="gs-social-ahmedsabrari-aurora-dark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F1EA"/>
      <stop offset="54%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F1EA"/>
    </linearGradient>

    <radialGradient id="gs-social-ahmedsabrari-aurora-dark-orb-0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.24"/>
      <stop offset="58%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gs-social-ahmedsabrari-aurora-dark-orb-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.20"/>
      <stop offset="58%" stop-color="#14B8A6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gs-social-ahmedsabrari-aurora-dark-orb-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.24"/>
      <stop offset="58%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gs-social-ahmedsabrari-aurora-dark-orb-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.20"/>
      <stop offset="58%" stop-color="#14B8A6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gs-social-ahmedsabrari-aurora-dark-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F2933" stop-opacity="0.20"/>
      <stop offset="44%" stop-color="#4F46E5" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="gs-social-ahmedsabrari-aurora-dark-holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F2933"/>
      <stop offset="18%" stop-color="#F4F1EA"/>
      <stop offset="38%" stop-color="#4F46E5"/>
      <stop offset="58%" stop-color="#14B8A6"/>
      <stop offset="78%" stop-color="#F4F1EA"/>
      <stop offset="100%" stop-color="#1F2933"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    #gs-social-ahmedsabrari-aurora-dark .aura-orb-a { animation: gs-social-ahmedsabrari-aurora-dark-float-a 9s ease-in-out infinite; }
    #gs-social-ahmedsabrari-aurora-dark .aura-orb-b { animation: gs-social-ahmedsabrari-aurora-dark-float-b 11s ease-in-out infinite 1.1s; }
    #gs-social-ahmedsabrari-aurora-dark .aura-orb-c { animation: gs-social-ahmedsabrari-aurora-dark-float-c 13s ease-in-out infinite 0.6s; }
    #gs-social-ahmedsabrari-aurora-dark .aura-chip { animation: gs-social-ahmedsabrari-aurora-dark-chip 650ms ease-out both; }
    @keyframes gs-social-ahmedsabrari-aurora-dark-float-a { 0%,100% { transform: translate(0,0); opacity: .58; } 50% { transform: translate(28px,-20px); opacity: .86; } }
    @keyframes gs-social-ahmedsabrari-aurora-dark-float-b { 0%,100% { transform: translate(0,0); opacity: .42; } 50% { transform: translate(-24px,18px); opacity: .72; } }
    @keyframes gs-social-ahmedsabrari-aurora-dark-float-c { 0%,100% { transform: translate(0,0) scale(1); opacity: .34; } 50% { transform: translate(18px,-12px) scale(1.18); opacity: .62; } }
    @keyframes gs-social-ahmedsabrari-aurora-dark-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      #gs-social-ahmedsabrari-aurora-dark * { animation: none !important; }
    }
  </style>

  <g id="gs-social-ahmedsabrari-aurora-dark">
    <rect width="860" height="126" rx="20" fill="url(#gs-social-ahmedsabrari-aurora-dark-bg)"/>

    <ellipse class="aura-orb-a" cx="138" cy="23" rx="206" ry="58" fill="url(#gs-social-ahmedsabrari-aurora-dark-orb-0)"/>
    <ellipse class="aura-orb-b" cx="654" cy="28" rx="241" ry="53" fill="url(#gs-social-ahmedsabrari-aurora-dark-orb-1)"/>
    <ellipse class="aura-orb-c" cx="499" cy="111" rx="310" ry="43" fill="url(#gs-social-ahmedsabrari-aurora-dark-orb-2)"/>
    <ellipse class="aura-orb-b" cx="826" cy="98" rx="172" ry="53" fill="url(#gs-social-ahmedsabrari-aurora-dark-orb-3)"/>

    <rect x="26" y="22" width="808" height="82" rx="22" fill="#FFFFFF" fill-opacity="0.9" stroke="#4F46E5" stroke-opacity="0.35"/>

    <g class="aura-chip" style="animation-delay:0ms">
      <rect x="341" y="40" width="178" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.9" stroke="url(#gs-social-ahmedsabrari-aurora-dark-holo)" stroke-width="2"/>
      <rect x="342" y="41" width="176" height="44" rx="22" fill="none" stroke="rgba(31,41,51,0.08)"/>
      <circle cx="368" cy="63" r="12" fill="rgba(79,70,229,0.10)"/>
      <text x="368" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="900" fill="#1F2933" text-anchor="middle">G</text>
      <text x="389" y="59" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="850" letter-spacing="1.2" fill="#14B8A6">GitHub</text>
      <text x="389" y="75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="800" fill="#1F2933">@{{username}}</text>
    </g>

    <rect x="0.5" y="0.5" width="859" height="125" rx="19.5" fill="none" stroke="#D9D2C7" stroke-opacity="0.62"/>
  </g>
</svg>