<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="240" viewBox="0 0 860 240" role="img" aria-labelledby="hmTitle hmDesc">
  <title id="hmTitle">Contribution Activity — {{name}}</title>
  <desc id="hmDesc">Contribution heatmap showing {{contributions}} contributions in the last year. Activity ranges from less to more across the year.</desc>
  <defs>
    <linearGradient id="gs-heatmap-ahmedsabrari-aurora-dark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F1EA"/>
      <stop offset="54%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F1EA"/>
    </linearGradient>

    <radialGradient id="gs-heatmap-ahmedsabrari-aurora-dark-orb-0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.30"/>
      <stop offset="58%" stop-color="#4F46E5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gs-heatmap-ahmedsabrari-aurora-dark-orb-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.24"/>
      <stop offset="58%" stop-color="#14B8A6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gs-heatmap-ahmedsabrari-aurora-dark-orb-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gs-heatmap-ahmedsabrari-aurora-dark-orb-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.22"/>
      <stop offset="58%" stop-color="#14B8A6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gs-heatmap-ahmedsabrari-aurora-dark-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F2933" stop-opacity="0.16"/>
      <stop offset="44%" stop-color="#4F46E5" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#6B7280" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <style>
    #gs-heatmap-ahmedsabrari-aurora-dark .aura-orb-a { animation: gs-heatmap-ahmedsabrari-aurora-dark-float-a 9s ease-in-out infinite; }
    #gs-heatmap-ahmedsabrari-aurora-dark .aura-orb-b { animation: gs-heatmap-ahmedsabrari-aurora-dark-float-b 11s ease-in-out infinite 1.1s; }
    #gs-heatmap-ahmedsabrari-aurora-dark .aura-orb-c { animation: gs-heatmap-ahmedsabrari-aurora-dark-float-c 13s ease-in-out infinite 0.6s; }
    @keyframes gs-heatmap-ahmedsabrari-aurora-dark-float-a { 0%,100% { transform: translate(0,0); opacity: .58; } 50% { transform: translate(28px,-20px); opacity: .86; } }
    @keyframes gs-heatmap-ahmedsabrari-aurora-dark-float-b { 0%,100% { transform: translate(0,0); opacity: .42; } 50% { transform: translate(-24px,18px); opacity: .72; } }
    @keyframes gs-heatmap-ahmedsabrari-aurora-dark-float-c { 0%,100% { transform: translate(0,0) scale(1); opacity: .34; } 50% { transform: translate(18px,-12px) scale(1.18); opacity: .62; } }

    @media (prefers-reduced-motion: reduce) {
      #gs-heatmap-ahmedsabrari-aurora-dark .aura-orb-a,
      #gs-heatmap-ahmedsabrari-aurora-dark .aura-orb-b,
      #gs-heatmap-ahmedsabrari-aurora-dark .aura-orb-c {
        animation: none !important;
      }
    }
  </style>

  <g id="gs-heatmap-ahmedsabrari-aurora-dark">
    <rect width="860" height="240" rx="20" fill="url(#gs-heatmap-ahmedsabrari-aurora-dark-bg)"/>

    <ellipse class="aura-orb-a" cx="138" cy="41" rx="206" ry="106" fill="url(#gs-heatmap-ahmedsabrari-aurora-dark-orb-0)"/>
    <ellipse class="aura-orb-b" cx="654" cy="51" rx="241" ry="97" fill="url(#gs-heatmap-ahmedsabrari-aurora-dark-orb-1)"/>
    <ellipse class="aura-orb-c" cx="499" cy="202" rx="310" ry="78" fill="url(#gs-heatmap-ahmedsabrari-aurora-dark-orb-2)"/>
    <ellipse class="aura-orb-b" cx="826" cy="179" rx="172" ry="97" fill="url(#gs-heatmap-ahmedsabrari-aurora-dark-orb-3)"/>

    <rect x="26" y="26" width="808" height="188" rx="20" fill="#FFFFFF" fill-opacity="0.55" stroke="#D9D2C7" stroke-opacity="1"/>

    <text x="46" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="850" letter-spacing="-0.4" fill="#1F2933">Contribution Activity</text>
    <text x="48" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="650" letter-spacing="0.6" fill="#6B7280">{{contributions}} contributions in the last year</text>

    <text x="648" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#6B7280" text-anchor="end">Less</text>
    <rect x="656" y="63" width="11" height="11" rx="2.5" fill="#6B7280" fill-opacity="0.07"/>
    <rect x="671" y="63" width="11" height="11" rx="2.5" fill="#4F46E5" fill-opacity="0.34"/>
    <rect x="686" y="63" width="11" height="11" rx="2.5" fill="#4F46E5" fill-opacity="0.56"/>
    <rect x="701" y="63" width="11" height="11" rx="2.5" fill="#4F46E5" fill-opacity="0.78"/>
    <rect x="716" y="63" width="11" height="11" rx="2.5" fill="#4F46E5" fill-opacity="1"/>
    <text x="737" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#6B7280">More</text>

    {{heatmapCells}}

    <rect x="0.5" y="0.5" width="859" height="239" rx="19.5" fill="none" stroke="#D9D2C7" stroke-opacity="1"/>
  </g>
</svg>