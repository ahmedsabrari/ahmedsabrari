<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="452" viewBox="0 0 860 452" role="img" aria-label="Projects list">
  <defs>
    <linearGradient id="gs-projects-ahmedsabrari-aurora-dark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F1EA"/>
      <stop offset="54%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F1EA"/>
    </linearGradient>

    <radialGradient id="gs-projects-ahmedsabrari-aurora-dark-orb-0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.24"/>
      <stop offset="58%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gs-projects-ahmedsabrari-aurora-dark-orb-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.20"/>
      <stop offset="58%" stop-color="#14B8A6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gs-projects-ahmedsabrari-aurora-dark-orb-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.24"/>
      <stop offset="58%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gs-projects-ahmedsabrari-aurora-dark-orb-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.20"/>
      <stop offset="58%" stop-color="#14B8A6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    #gs-projects-ahmedsabrari-aurora-dark .aura-orb-a { animation: gs-projects-ahmedsabrari-aurora-dark-float-a 9s ease-in-out infinite; }
    #gs-projects-ahmedsabrari-aurora-dark .aura-orb-b { animation: gs-projects-ahmedsabrari-aurora-dark-float-b 11s ease-in-out infinite 1.1s; }
    #gs-projects-ahmedsabrari-aurora-dark .aura-orb-c { animation: gs-projects-ahmedsabrari-aurora-dark-float-c 13s ease-in-out infinite 0.6s; }
    @keyframes gs-projects-ahmedsabrari-aurora-dark-float-a { 0%,100% { transform: translate(0,0); opacity:.58; } 50% { transform: translate(28px,-20px); opacity:.86; } }
    @keyframes gs-projects-ahmedsabrari-aurora-dark-float-b { 0%,100% { transform: translate(0,0); opacity:.42; } 50% { transform: translate(-24px,18px); opacity:.72; } }
    @keyframes gs-projects-ahmedsabrari-aurora-dark-float-c { 0%,100% { transform: translate(0,0) scale(1); opacity:.34; } 50% { transform: translate(18px,-12px) scale(1.18); opacity:.62; } }
    @media (prefers-reduced-motion: reduce) {
      #gs-projects-ahmedsabrari-aurora-dark * { animation: none !important; }
    }
  </style>

  <g id="gs-projects-ahmedsabrari-aurora-dark">
    <rect width="860" height="452" rx="20" fill="url(#gs-projects-ahmedsabrari-aurora-dark-bg)"/>

    <ellipse class="aura-orb-a" cx="138" cy="81"  rx="206" ry="208" fill="url(#gs-projects-ahmedsabrari-aurora-dark-orb-0)"/>
    <ellipse class="aura-orb-b" cx="654" cy="99"  rx="241" ry="190" fill="url(#gs-projects-ahmedsabrari-aurora-dark-orb-1)"/>
    <ellipse class="aura-orb-c" cx="499" cy="398" rx="310" ry="154" fill="url(#gs-projects-ahmedsabrari-aurora-dark-orb-2)"/>
    <ellipse class="aura-orb-b" cx="826" cy="353" rx="172" ry="190" fill="url(#gs-projects-ahmedsabrari-aurora-dark-orb-3)"/>

    <text x="30" y="40" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#4F46E5">PROJECTS.LIST</text>
    <text x="180" y="40" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#14B8A6" fill-opacity="0.85">./projects.sh --all</text>
    <text x="830" y="40" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6B7280" fill-opacity="0.85">{{totalRepos}} repos</text>
    <line x1="28" y1="52" x2="832" y2="52" stroke="#4F46E5" stroke-opacity="0.35" stroke-width="1.5"/>

    {{#each topRepos}}
    <a href="{{url}}" target="_blank">
      <g opacity="0" transform="translate({{x}},{{y}})">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="{{delay}}s" fill="freeze"/>
        <rect width="260" height="162" rx="13" fill="#FFFFFF" fill-opacity="0.9" stroke="#4F46E5">
          <animate attributeName="stroke-opacity" values="0.35;0.75;0.35" dur="4.5s" begin="{{delay}}s" repeatCount="indefinite"/>
        </rect>
        <path d="M0 13 a13 13 0 0 1 13 -13 h234 a13 13 0 0 1 13 13 v17 h-260 z" fill="#4F46E5" fill-opacity="0.06"/>
        <line x1="0" y1="30" x2="260" y2="30" stroke="#4F46E5" stroke-opacity="0.35"/>
        <text x="14" y="19.5" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6B7280"><tspan fill="#4F46E5">•</tspan> {{name}}</text>
        <circle cx="246" cy="15" r="3.5" fill="#14B8A6" fill-opacity="0.7"/>
        <text x="16" y="58" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#1F2933">{{name}}</text>
        <text x="16" y="79" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6B7280">{{description}}</text>

        <rect x="16" y="112" width="{{chipWidth}}" height="18" rx="9" fill="{{color}}" fill-opacity="0.12" stroke="{{color}}" stroke-opacity="0.5"/>
        <text x="{{chipTextX}}" y="124.5" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="{{color}}">{{language}}</text>
        <text x="16" y="150" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6B7280"><tspan fill="#14B8A6">★</tspan> {{stars}}<tspan fill="#6B7280" dx="12">{{updated}}</tspan></text>
      </g>
    </a>
    {{/each}}

    <rect x="0.5" y="0.5" width="859" height="451" rx="19.5" fill="none" stroke="#D9D2C7" stroke-opacity="0.62"/>
  </g>
</svg>