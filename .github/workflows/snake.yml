name: 🐍 Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🎨 Generate Snake (raw)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/snake-raw.svg?color_snake=#14B8A6&color_dots=#EDE9E2,#C3C0F6,#9C97F0,#766FEB,#4F46E5

      - name: 💅 Wrap in Aurora Card
        run: node .github/scripts/wrap-snake.js

      - name: 📤 Commit & Push
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f snake/snake-raw.svg
          git add snake/
          if ! git diff --staged --quiet; then
            git commit -m "🐍 Snake update $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          else
            echo "✅ Ma kaynch tbeddil"
          fi