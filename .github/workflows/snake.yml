name: 🐍 Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🎨 Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ahmedsabrari
          outputs: |
            snake/snake.svg?color_snake=#14B8A6&color_dots=#F4F1EA,#C3C0F6,#9C97F0,#766FEB,#4F46E5
            snake/snake.gif?color_snake=#14B8A6&color_dots=#F4F1EA,#C3C0F6,#9C97F0,#766FEB,#4F46E5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Commit & Push
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake/
          if ! git diff --staged --quiet; then
            git commit -m "🐍 تحديث الثعبان $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "✅ لا توجد تغييرات"
          fi