<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" aria-labelledby="cpTitle cpDesc">
  <title id="cpTitle">AHMED SABRARI — developer profile card</title>
  <desc id="cpDesc">Profile card for @AHMEDSABRARI, full-stack engineer and competitive programmer. Skills: PHP, Blade, JavaScript, Python. Total stars: 7.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F4F1EA"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F1EA"/>
    </linearGradient>

    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4F46E5" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#8B93A7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>

    <radialGradient id="glowIndigo">
      <stop offset="0%"   stop-color="#4F46E5" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowTeal">
      <stop offset="0%"   stop-color="#14B8A6" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .t { font-family: Arial, Helvetica, sans-serif; }

    .handle     { font-size: 12px;   font-weight: 700; letter-spacing: 1.8px; fill: #4F46E5; }
    .name       { font-size: 21px;   font-weight: 700; letter-spacing: 0.8px; fill: #1F2933; }
    .bio        { font-size: 11.5px; font-weight: 400;                        fill: #6B7280; }
    .chip-label { font-size: 12px;   font-weight: 600;                        fill: #1F2933; }
    .stat-num   { font-size: 34px;   font-weight: 700;                        fill: #1F2933; }
    .stat-label { font-size: 10px;   font-weight: 700; letter-spacing: 2.4px; fill: #6B7280; }

    .orbit        { transform-box: view-box; transform-origin: 735px 118px; animation: orbit 9s linear infinite; }
    .orbit-dot    { transform-box: fill-box; transform-origin: center; animation: orbitDot 2.6s ease-in-out infinite; }
    .ring-spin    { transform-box: fill-box; transform-origin: center; animation: spinSlow 26s linear infinite; }
    .ring-pulse   { transform-box: fill-box; transform-origin: center; animation: pulseRing 3.4s ease-in-out infinite; }
    .ring-pulse-2 { transform-box: fill-box; transform-origin: center; animation: pulseRing 3.4s ease-in-out 0.6s infinite; }
    .halo         { transform-box: fill-box; transform-origin: center; animation: pulseRing 4.5s ease-in-out infinite; }
    .orb-a        { transform-box: fill-box; transform-origin: center; animation: drift1 10s ease-in-out infinite; }
    .orb-b        { transform-box: fill-box; transform-origin: center; animation: drift2 12s ease-in-out infinite; }

    .chip { animation: chipIn .55s cubic-bezier(.22,.7,.3,1) both; }
    .chip:nth-of-type(1) { animation-delay: .10s; }
    .chip:nth-of-type(2) { animation-delay: .22s; }
    .chip:nth-of-type(3) { animation-delay: .34s; }
    .chip:nth-of-type(4) { animation-delay: .46s; }

    @keyframes orbit     { to { transform: rotate(360deg); } }
    @keyframes spinSlow  { to { transform: rotate(360deg); } }
    @keyframes orbitDot  { 0%,100% { transform: scale(1); } 50% { transform: scale(1.55); } }
    @keyframes pulseRing { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.05); opacity: 1; } }
    @keyframes drift1    { 0%,100% { transform: translate(0,0); } 50% { transform: translate(20px,-12px); } }
    @keyframes drift2    { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-18px,10px); } }
    @keyframes chipIn    { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .orbit, .orbit-dot, .ring-spin, .ring-pulse, .ring-pulse-2,
      .halo, .orb-a, .orb-b, .chip {
        animation: none !important;
      }
    }
  </style>

  <!-- ===== Canvas ===== -->
  <rect width="860" height="240" rx="20" fill="url(#bgGrad)"/>
  <rect x="26" y="26" width="808" height="188" rx="14"
        fill="#FFFFFF" fill-opacity="0.55" stroke="#D9D2C7" stroke-width="1.2"/>

  <!-- ===== Decorative glow orbs ===== -->
  <g aria-hidden="true">
    <circle class="orb-a" cx="196" cy="58"  r="52" fill="url(#glowIndigo)"/>
    <circle class="orb-b" cx="704" cy="196" r="62" fill="url(#glowTeal)"/>
  </g>

  <!-- ===== Decorative shine ===== -->
  <path aria-hidden="true"
        d="M166 76 C 230 62, 346 62, 410 77"
        fill="none" stroke="url(#shineGrad)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- ===== Left: identity block ===== -->
  <g>
    <circle class="halo" cx="96" cy="94" r="40" fill="#4F46E5" fill-opacity="0.07"/>
    <circle cx="96" cy="94" r="34" fill="url(#avatarGrad)"/>
    <text class="t" x="96" y="102" text-anchor="middle"
          font-size="22" font-weight="700" fill="#FFFFFF">AS</text>

    <text class="t handle" x="146" y="66">@AHMEDSABRARI</text>
    <text class="t name"   x="146" y="92">AHMED SABRARI</text>
    <text class="t bio"    x="146" y="112">Full-stack engineer · Competitive programmer</text>
  </g>

  <!-- ===== Left: skill chips ===== -->
  <g class="chips">
    <g class="chip">
      <rect x="146" y="166" width="110" height="28" rx="14"
            fill="#FFFFFF" stroke="#D9D2C7" stroke-width="1.2"/>
      <text class="t chip-label" x="201" y="184.5" text-anchor="middle">PHP</text>
    </g>
    <g class="chip">
      <rect x="264" y="166" width="110" height="28" rx="14"
            fill="#FFFFFF" stroke="#D9D2C7" stroke-width="1.2"/>
      <text class="t chip-label" x="319" y="184.5" text-anchor="middle">Blade</text>
    </g>
    <g class="chip">
      <rect x="382" y="166" width="110" height="28" rx="14"
            fill="#FFFFFF" stroke="#D9D2C7" stroke-width="1.2"/>
      <text class="t chip-label" x="437" y="184.5" text-anchor="middle">JavaScript</text>
    </g>
    <g class="chip">
      <rect x="500" y="166" width="110" height="28" rx="14"
            fill="#FFFFFF" stroke="#D9D2C7" stroke-width="1.2"/>
      <text class="t chip-label" x="555" y="184.5" text-anchor="middle">Python</text>
    </g>
  </g>

  <!-- ===== Right: stat cluster ===== -->
  <g aria-hidden="true">
    <!-- outer dashed ring -->
    <circle class="ring-spin" cx="735" cy="118" r="54" fill="none"
            stroke="#D9D2C7" stroke-width="1.4" stroke-dasharray="3 7" stroke-linecap="round"/>

    <!-- middle progress ring -->
    <circle cx="735" cy="118" r="43" fill="none" stroke="#EDE9E2" stroke-width="6"/>
    <g transform="rotate(-90 735 118)">
      <circle class="ring-pulse" cx="735" cy="118" r="43" fill="none"
              stroke="#4F46E5" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="189 81"/>
    </g>

    <!-- inner accent ring -->
    <circle cx="735" cy="118" r="32" fill="none" stroke="#EDE9E2" stroke-width="3"/>
    <g transform="rotate(-90 735 118)">
      <circle class="ring-pulse-2" cx="735" cy="118" r="32" fill="none"
              stroke="#14B8A6" stroke-width="3" stroke-linecap="round"
              stroke-dasharray="72 129"/>
    </g>

    <!-- orbiting dot -->
    <g class="orbit">
      <circle cx="735" cy="64" r="14" fill="url(#glowIndigo)"/>
      <circle class="orbit-dot" cx="735" cy="64" r="4.5" fill="#4F46E5"/>
    </g>
  </g>

  <text class="t stat-num"   x="735" y="130" text-anchor="middle">7</text>
  <text class="t stat-label" x="735" y="187" text-anchor="middle">TOTAL STARS</text>
</svg>