<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" fill="none" role="img" aria-label="AHMED SABRARI - Full-Stack Developer, AI/ML Engineer, Founder">
  <desc>Animated warm zen-light banner for AHMED SABRARI</desc>
  <defs>
    <!-- warm ivory backdrop -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F1EA"/>
      <stop offset="54%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F1EA"/>
    </linearGradient>

    <!-- soft glow orbs -->
    <radialGradient id="orbIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.24"/>
      <stop offset="58%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbSlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.18"/>
      <stop offset="58%" stop-color="#334155" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.24"/>
      <stop offset="58%" stop-color="#14B8A6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>

    <!-- decorative shine gradient -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F2933" stop-opacity="0.18"/>
      <stop offset="44%" stop-color="#4F46E5" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#6B7280" stop-opacity="0.20"/>
    </linearGradient>

    <!-- flowing electric border -->
    <linearGradient id="borderGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#D9D2C7"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#D9D2C7"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- divider gradient -->
    <linearGradient id="dividerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D9D2C7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#D9D2C7" stop-opacity="0"/>
    </linearGradient>

    <!-- softened electric border filter -->
    <filter id="electric" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="2" result="noise">
        <animate attributeName="baseFrequency" dur="11s" values="0.012;0.018;0.012" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <clipPath id="frame">
      <rect width="1200" height="400" rx="30"/>
    </clipPath>
  </defs>

  <style>
    #zen .orb-a { animation: ft-a 9s  ease-in-out infinite; }
    #zen .orb-b { animation: ft-b 11s ease-in-out infinite 1.1s; }
    #zen .orb-c { animation: ft-c 13s ease-in-out infinite .6s; }

    @keyframes ft-a { 0%,100% { transform: translate(0,0); opacity:.6 } 50% { transform: translate(30px,-18px); opacity:.9 } }
    @keyframes ft-b { 0%,100% { transform: translate(0,0); opacity:.5 } 50% { transform: translate(-26px,16px); opacity:.8 } }
    @keyframes ft-c { 0%,100% { transform: translate(0,0) scale(1); opacity:.4 } 50% { transform: translate(18px,-12px) scale(1.12); opacity:.7 } }

    #zen .tw  { animation: tw 3s   ease-in-out infinite; }
    #zen .tw2 { animation: tw 2.6s ease-in-out infinite .6s; }
    #zen .tw3 { animation: tw 3.4s ease-in-out infinite 1.1s; }
    @keyframes tw { 0%,100% { opacity:.12 } 50% { opacity:.7 } }

    #zen .flick  { animation: fl 3.2s steps(1) infinite; }
    #zen .flick2 { animation: fl 4s   steps(1) infinite .8s; }
    @keyframes fl { 0%,7%,12%,100% { opacity:.28 } 9%,55% { opacity:.08 } 60%,70% { opacity:.4 } }

    #zen .float { animation: ft 8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ft { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }

    #zen .pulse { animation: pl 4s ease-in-out infinite; }
    @keyframes pl { 0%,100% { opacity:.4 } 50% { opacity:.85 } }

    #zen .dash { stroke-dasharray: 14 10; animation: dh 2.2s linear infinite; }
    @keyframes dh { to { stroke-dashoffset: -48 } }

    @media (prefers-reduced-motion: reduce) { #zen * { animation: none !important; } }
  </style>

  <g id="zen">
    <!-- backdrop + soft glow orbs, clipped to rounded frame -->
    <g clip-path="url(#frame)" aria-hidden="true">
      <rect width="1200" height="400" rx="30" fill="url(#bg)"/>
      <ellipse class="orb-a" cx="180"  cy="50"  rx="320" ry="170" fill="url(#orbIndigo)"/>
      <ellipse class="orb-b" cx="1010" cy="60"  rx="360" ry="160" fill="url(#orbSlate)"/>
      <ellipse class="orb-c" cx="620"  cy="390" rx="460" ry="130" fill="url(#orbTeal)"/>
      <ellipse class="orb-b" cx="1120" cy="350" rx="280" ry="150" fill="url(#orbIndigo)"/>
    </g>

    <!-- soft twinkle field (indigo + teal) -->
    <g aria-hidden="true">
      <circle class="tw"  cx="90"   cy="70"  r="1.6" fill="#4F46E5"/>
      <circle class="tw2" cx="300"  cy="86"  r="1.9" fill="#14B8A6"/>
      <circle class="tw3" cx="560"  cy="64"  r="1.4" fill="#4F46E5"/>
      <circle class="tw"  cx="840"  cy="96"  r="1.3" fill="#334155"/>
      <circle class="tw2" cx="1100" cy="78"  r="1.7" fill="#4F46E5"/>
      <circle class="tw3" cx="180"  cy="312" r="1.5" fill="#14B8A6"/>
      <circle class="tw"  cx="430"  cy="332" r="1.3" fill="#4F46E5"/>
      <circle class="tw2" cx="700"  cy="320" r="1.7" fill="#334155"/>
      <circle class="tw3" cx="980"  cy="316" r="1.4" fill="#14B8A6"/>
      <circle class="tw"  cx="1132" cy="322" r="1.5" fill="#4F46E5"/>
      <circle class="tw2" cx="60"   cy="208" r="1.2" fill="#334155"/>
      <circle class="tw3" cx="1150" cy="190" r="1.5" fill="#14B8A6"/>
      <circle class="tw"  cx="250"  cy="180" r="1.0" fill="#4F46E5"/>
      <circle class="tw2" cx="380"  cy="58"  r="1.1" fill="#14B8A6"/>
      <circle class="tw3" cx="760"  cy="56"  r="1.2" fill="#4F46E5"/>
      <circle class="tw"  cx="1040" cy="176" r="1.4" fill="#334155"/>
    </g>

    <!-- accent bolts (softened: no glow filter, thinner) -->
    <g stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path class="flick"  d="M120 40 L150 120 L122 132 L168 230 L138 244 L182 340" stroke="#4F46E5" opacity="0.75"/>
      <path class="flick2" d="M1080 44 L1052 118 L1082 130 L1040 224 L1070 238 L1028 336" stroke="#14B8A6" opacity="0.75"/>
    </g>

    <!-- electric border (softened displacement) -->
    <rect x="26" y="26" width="1148" height="348" rx="26"
          fill="none" stroke="url(#borderGrad)" stroke-width="2" filter="url(#electric)"/>

    <!-- HUD corner brackets -->
    <g stroke="#4F46E5" stroke-width="2.2" fill="none" class="pulse" stroke-linecap="round" opacity="0.7" aria-hidden="true">
      <path d="M54 86 L54 54 L86 54"/>
      <path d="M1146 86 L1146 54 L1114 54"/>
      <path d="M54 314 L54 346 L86 346"/>
      <path d="M1146 314 L1146 346 L1114 346"/>
    </g>

    <!-- content -->
    <g class="float">
      <text x="600" y="150" text-anchor="middle"
            font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif"
            font-size="15" letter-spacing="7" fill="#6B7280">@AHMEDSABRARI</text>

      <text x="600" y="244" text-anchor="middle"
            font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif"
            font-size="96" font-weight="800" letter-spacing="6" fill="#1F2933">AHMED SABRARI</text>

      <line class="dash" x1="372" y1="270" x2="828" y2="270"
            stroke="url(#dividerGrad)" stroke-width="2.2" stroke-linecap="round"/>

      <text x="600" y="312" text-anchor="middle"
            font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif"
            font-size="18" letter-spacing="5" fill="#6B7280">Frontend or full-stack engineer</text>
    </g>
  </g>
</svg>