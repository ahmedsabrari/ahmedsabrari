    #gs-highlights-ahmedsabrari-aurora-dark .aura-chip { animation: gs-highlights-ahmedsabrari-aurora-dark-chip 650ms ease-out both; }
    #gs-highlights-ahmedsabrari-aurora-dark .aura-cursor { animation: gs-highlights-ahmedsabrari-aurora-dark-cursor 1.1s step-end infinite; }
    #gs-highlights-ahmedsabrari-aurora-dark .aura-bar { animation: gs-highlights-ahmedsabrari-aurora-dark-bar 1.15s ease-out both; transform-box: fill-box; transform-origin: left; }
    #gs-highlights-ahmedsabrari-aurora-dark .aura-cell { animation: gs-highlights-ahmedsabrari-aurora-dark-cell 520ms ease-out both; }
    @keyframes gs-highlights-ahmedsabrari-aurora-dark-cell { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes gs-highlights-ahmedsabrari-aurora-dark-float-a { 0%,100% { transform: translate(0,0); opacity: .42; } 50% { transform: translate(28px,-20px); opacity: .66; } }
    @keyframes gs-highlights-ahmedsabrari-aurora-dark-float-b { 0%,100% { transform: translate(0,0); opacity: .32; } 50% { transform: translate(-24px,18px); opacity: .56; } }
    @keyframes gs-highlights-ahmedsabrari-aurora-dark-float-c { 0%,100% { transform: translate(0,0) scale(1); opacity: .24; } 50% { transform: translate(18px,-12px) scale(1.18); opacity: .48; } }
    @keyframes gs-highlights-ahmedsabrari-aurora-dark-ring { 0%,100% { opacity: .05; } 50% { opacity: .18; } }
    @keyframes gs-highlights-ahmedsabrari-aurora-dark-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes gs-highlights-ahmedsabrari-aurora-dark-cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes gs-highlights-ahmedsabrari-aurora-dark-bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    @media (prefers-reduced-motion: reduce) {
      #gs-highlights-ahmedsabrari-aurora-dark .aura-orb-a,
      #gs-highlights-ahmedsabrari-aurora-dark .aura-orb-b,
      #gs-highlights-ahmedsabrari-aurora-dark .aura-orb-c,
      #gs-highlights-ahmedsabrari-aurora-dark .aura-ring,
      #gs-highlights-ahmedsabrari-aurora-dark .aura-ring-b,
      #gs-highlights-ahmedsabrari-aurora-dark .aura-chip,
      #gs-highlights-ahmedsabrari-aurora-dark .aura-cursor,
      #gs-highlights-ahmedsabrari-aurora-dark .aura-bar,
      #gs-highlights-ahmedsabrari-aurora-dark .aura-cell { animation: none !important; }
    }
  </style>
