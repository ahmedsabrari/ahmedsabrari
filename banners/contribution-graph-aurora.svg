<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" aria-labelledby="cgTitle cgDesc">
  <title id="cgTitle">AHMED SABRARI's Contribution Graph</title>
  <desc id="cgDesc">Contribution graph for the last 91 days, showing 44 contributions in the last year. Two activity spikes appear near 09-02.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F4F1EA"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F1EA"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#14B8A6"/>
      <stop offset="60%"  stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4F46E5" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#8B93A7" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowIndigo">
      <stop offset="0%"   stop-color="#4F46E5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowTeal">
      <stop offset="0%"   stop-color="#14B8A6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .t { font-family: Arial, Helvetica, sans-serif; }

    .title    { font-size: 17px;   font-weight: 700; letter-spacing: 0.3px; fill: #1F2933; }
    .subtitle { font-size: 10.5px; font-weight: 600; letter-spacing: 0.8px; fill: #4F46E5; }
    .tick     { font-size: 10px;   font-weight: 600;                        fill: #6B7280; }
    .axis-lbl { font-size: 10px;   font-weight: 700; letter-spacing: 1.6px; fill: #6B7280; }

    .grid  { animation: fadeIn .9s ease-out both; }
    .grid:nth-of-type(1) { animation-delay: .05s; }
    .grid:nth-of-type(2) { animation-delay: .15s; }

    .line  {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: drawLine 1.8s cubic-bezier(.4,0,.2,1) .15s both;
    }

    .dot { animation: dotIn .45s cubic-bezier(.34,1.56,.64,1) both; }
    .dot:nth-of-type(1)  { animation-delay: .20s; }
    .dot:nth-of-type(2)  { animation-delay: .26s; }
    .dot:nth-of-type(3)  { animation-delay: .32s; }
    .dot:nth-of-type(4)  { animation-delay: .38s; }
    .dot:nth-of-type(5)  { animation-delay: .44s; }
    .dot:nth-of-type(6)  { animation-delay: .50s; }
    .dot:nth-of-type(7)  { animation-delay: .56s; }
    .dot:nth-of-type(8)  { animation-delay: .62s; }
    .dot:nth-of-type(9)  { animation-delay: .68s; }
    .dot:nth-of-type(10) { animation-delay: .74s; }
    .dot:nth-of-type(11) { animation-delay: .80s; }
    .dot:nth-of-type(12) { animation-delay: .86s; }
    .dot:nth-of-type(13) { animation-delay: .92s; }
    .dot:nth-of-type(14) { animation-delay: .98s; }

    .peak      { transform-box: fill-box; transform-origin: center; animation: pulseDot 2.8s ease-in-out 1.2s infinite; }
    .peak-halo { transform-box: fill-box; transform-origin: center; animation: pulseRing 3.6s ease-in-out infinite; }

    .orb-a { transform-box: fill-box; transform-origin: center; animation: drift1 11s ease-in-out infinite; }
    .orb-b { transform-box: fill-box; transform-origin: center; animation: drift2 13s ease-in-out infinite; }

    @keyframes drawLine  { to { stroke-dashoffset: 0; } }
    @keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }
    @keyframes dotIn     { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulseDot  { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
    @keyframes pulseRing { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.5); opacity: 0; } }
    @keyframes drift1    { 0%,100% { transform: translate(0,0); } 50% { transform: translate(22px,-12px); } }
    @keyframes drift2    { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-18px,10px); } }

    @media (prefers-reduced-motion: reduce) {
      .grid, .line, .dot, .peak, .peak-halo, .orb-a, .orb-b {
        animation: none !important;
      }
      .line { stroke-dashoffset: 0; }
    }
  </style>

  <!-- ===== Canvas ===== -->
  <rect width="860" height="240" rx="20" fill="url(#bgGrad)"/>
  <rect x="26" y="26" width="808" height="188" rx="14"
        fill="#FFFFFF" fill-opacity="0.55" stroke="#D9D2C7" stroke-width="1.2"/>

  <!-- ===== Decorative glow orbs ===== -->
  <g aria-hidden="true">
    <circle class="orb-a" cx="176" cy="62"  r="50" fill="url(#glowIndigo)"/>
    <circle class="orb-b" cx="712" cy="198" r="60" fill="url(#glowTeal)"/>
  </g>

  <!-- ===== Decorative shine ===== -->
  <path aria-hidden="true"
        d="M300 66 C 360 58, 500 58, 560 66"
        fill="none" stroke="url(#shineGrad)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ===== Header ===== -->
  <text class="t title"    x="430" y="54" text-anchor="middle">AHMED SABRARI's Contribution Graph</text>
  <text class="t subtitle" x="430" y="72" text-anchor="middle">LAST 91 DAYS · 44 CONTRIBUTIONS IN THE LAST YEAR</text>

  <!-- ===== Gridlines ===== -->
  <g aria-hidden="true">
    <line class="grid" x1="68" y1="94"  x2="830" y2="94"
          stroke="#D9D2C7" stroke-width="1" stroke-dasharray="3 5"/>
    <line class="grid" x1="68" y1="178" x2="830" y2="178"
          stroke="#D9D2C7" stroke-width="1" stroke-dasharray="3 5"/>
  </g>

  <!-- ===== Y-axis ticks ===== -->
  <text class="t tick" x="60" y="98"  text-anchor="end">1</text>
  <text class="t tick" x="60" y="182" text-anchor="end">0</text>

  <!-- ===== Y-axis title ===== -->
  <text class="t axis-lbl" x="40" y="136" text-anchor="middle"
        transform="rotate(-90 40 136)">CONTRIBUTIONS</text>

  <!-- ===== Contribution line ===== -->
  <polyline class="line" pathLength="1"
    points="68,178 76.5,178 84.9,178 93.4,178 101.9,178 110.3,178 118.8,178 127.3,178 135.7,178 144.2,178 152.7,178 161.1,178 169.6,178 178.1,178 186.5,178 195,178 203.5,178 211.9,178 220.4,178 228.9,178 237.3,178 245.8,178 254.3,178 262.7,178 271.2,178 279.7,178 288.1,178 296.6,178 305.1,178 313.5,178 322,178 330.5,178 338.9,178 347.4,178 355.9,178 364.3,178 372.8,178 381.3,178 389.7,178 398.2,178 406.7,178 415.1,178 423.6,178 432.1,178 440.5,178 449,178 457.5,178 465.9,178 474.4,178 482.9,178 491.3,178 499.8,178 508.3,178 516.7,178 525.2,178 533.7,178 542.1,178 550.6,178 559.1,178 567.5,178 576,178 584.5,178 592.9,178 601.4,178 609.9,178 618.3,178 626.8,178 635.3,178 643.7,178 652.2,178 660.7,178 669.1,178 677.6,178 686.1,178 694.5,178 703,178 711.5,178 719.9,178 728.4,178 736.9,178 745.3,178 753.8,178 762.3,178 770.7,178 779.2,178 787.7,94 796.1,178 804.6,178 813.1,178 821.5,178 830,94"
    fill="none" stroke="url(#lineGrad)" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== Data point markers ===== -->
  <g>
    <circle class="dot" cx="68"    cy="178" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
    <circle class="dot" cx="127.3" cy="178" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
    <circle class="dot" cx="186.5" cy="178" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
    <circle class="dot" cx="245.8" cy="178" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
    <circle class="dot" cx="305.1" cy="178" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
    <circle class="dot" cx="364.3" cy="178" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
    <circle class="dot" cx="423.6" cy="178" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
    <circle class="dot" cx="482.9" cy="178" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
    <circle class="dot" cx="542.1" cy="178" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
    <circle class="dot" cx="601.4" cy="178" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
    <circle class="dot" cx="660.7" cy="178" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
    <circle class="dot" cx="719.9" cy="178" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
    <circle class="dot" cx="779.2" cy="178" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
    <circle class="dot" cx="830"   cy="94"  r="4" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- ===== Peak accent ===== -->
  <g aria-hidden="true">
    <circle class="peak-halo" cx="787.7" cy="94" r="12" fill="url(#glowIndigo)"/>
    <circle class="peak" cx="787.7" cy="94" r="5.5" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- ===== X-axis labels ===== -->
  <text class="t tick" x="68"    y="196" text-anchor="middle">06-10</text>
  <text class="t tick" x="186.5" y="196" text-anchor="middle">06-24</text>
  <text class="t tick" x="305.1" y="196" text-anchor="middle">07-08</text>
  <text class="t tick" x="423.6" y="196" text-anchor="middle">07-22</text>
  <text class="t tick" x="542.1" y="196" text-anchor="middle">08-05</text>
  <text class="t tick" x="660.7" y="196" text-anchor="middle">08-19</text>
  <text class="t tick" x="779.2" y="196" text-anchor="middle">09-02</text>
</svg>