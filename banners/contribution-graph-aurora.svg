<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" aria-labelledby="cgTitle cgDesc">
  <title id="cgTitle">AHMED SABRARI's Contribution Graph</title>
  <desc id="cgDesc">Contribution graph for the last 91 days, showing 90 contributions in the last year. Peak activity reaches 22 contributions in a single day.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F4F1EA"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F1EA"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#14B8A6"/>
      <stop offset="60%"  stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4F46E5" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#8B93A7" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowIndigo">
      <stop offset="0%"   stop-color="#4F46E5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowTeal">
      <stop offset="0%"   stop-color="#14B8A6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .t { font-family: Arial, Helvetica, sans-serif; }

    .title    { font-size: 17px;   font-weight: 700; letter-spacing: 0.3px; fill: #1F2933; }
    .subtitle { font-size: 10.5px; font-weight: 600; letter-spacing: 0.8px; fill: #4F46E5; }
    .tick     { font-size: 10px;   font-weight: 600;                        fill: #6B7280; }
    .axis-lbl { font-size: 10px;   font-weight: 700; letter-spacing: 1.6px; fill: #6B7280; }

    .grid  { animation: fadeIn .9s ease-out both; }
    .grid:nth-of-type(1) { animation-delay: .05s; }
    .grid:nth-of-type(2) { animation-delay: .15s; }

    .line  {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: drawLine 1.8s cubic-bezier(.4,0,.2,1) .15s both;
    }

    .dot { animation: dotIn .45s cubic-bezier(.34,1.56,.64,1) both; }

    .peak      { transform-box: fill-box; transform-origin: center; animation: pulseDot 2.8s ease-in-out 1.2s infinite; }
    .peak-halo { transform-box: fill-box; transform-origin: center; animation: pulseRing 3.6s ease-in-out infinite; }

    .orb-a { transform-box: fill-box; transform-origin: center; animation: drift1 11s ease-in-out infinite; }
    .orb-b { transform-box: fill-box; transform-origin: center; animation: drift2 13s ease-in-out infinite; }

    @keyframes drawLine  { to { stroke-dashoffset: 0; } }
    @keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }
    @keyframes dotIn     { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulseDot  { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
    @keyframes pulseRing { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.5); opacity: 0; } }
    @keyframes drift1    { 0%,100% { transform: translate(0,0); } 50% { transform: translate(22px,-12px); } }
    @keyframes drift2    { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-18px,10px); } }

    @media (prefers-reduced-motion: reduce) {
      .grid, .line, .dot, .peak, .peak-halo, .orb-a, .orb-b {
        animation: none !important;
      }
      .line { stroke-dashoffset: 0; }
    }
  </style>

  <!-- ===== Canvas ===== -->
  <rect width="860" height="240" rx="20" fill="url(#bgGrad)"/>
  <rect x="26" y="26" width="808" height="188" rx="14"
        fill="#FFFFFF" fill-opacity="0.55" stroke="#D9D2C7" stroke-width="1.2"/>

  <!-- ===== Decorative glow orbs ===== -->
  <g aria-hidden="true">
    <circle class="orb-a" cx="176" cy="62"  r="50" fill="url(#glowIndigo)"/>
    <circle class="orb-b" cx="712" cy="198" r="60" fill="url(#glowTeal)"/>
  </g>

  <!-- ===== Decorative shine ===== -->
  <path aria-hidden="true"
        d="M300 66 C 360 58, 500 58, 560 66"
        fill="none" stroke="url(#shineGrad)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ===== Header ===== -->
  <text class="t title"    x="430" y="54" text-anchor="middle">AHMED SABRARI's Contribution Graph</text>
  <text class="t subtitle" x="430" y="72" text-anchor="middle">LAST 91 DAYS · 90 CONTRIBUTIONS IN THE LAST YEAR</text>

  <!-- ===== Gridlines ===== -->
  <g aria-hidden="true">
    <line class="grid" x1="68" y1="94"  x2="830" y2="94"
          stroke="#D9D2C7" stroke-width="1" stroke-dasharray="3 5"/>
    <line class="grid" x1="68" y1="178" x2="830" y2="178"
          stroke="#D9D2C7" stroke-width="1" stroke-dasharray="3 5"/>
  </g>

  <!-- ===== Y-axis ticks ===== -->
  <text class="t tick" x="60" y="98"  text-anchor="end">22</text>
  <text class="t tick" x="60" y="182" text-anchor="end">0</text>

  <!-- ===== Y-axis title ===== -->
  <text class="t axis-lbl" x="40" y="136" text-anchor="middle"
        transform="rotate(-90 40 136)">CONTRIBUTIONS</text>

  <!-- ===== Contribution line (dynamic) ===== -->
  <polyline class="line" pathLength="1"
    points="68.0,178.0 76.5,178.0 84.9,178.0 93.4,178.0 101.9,178.0 110.3,178.0 118.8,178.0 127.3,178.0 135.7,178.0 144.2,178.0 152.7,178.0 161.1,178.0 169.6,178.0 178.1,178.0 186.5,178.0 195.0,178.0 203.5,178.0 211.9,178.0 220.4,178.0 228.9,178.0 237.3,178.0 245.8,178.0 254.3,178.0 262.7,178.0 271.2,178.0 279.7,178.0 288.1,178.0 296.6,178.0 305.1,178.0 313.5,178.0 322.0,178.0 330.5,178.0 338.9,178.0 347.4,178.0 355.9,178.0 364.3,178.0 372.8,178.0 381.3,178.0 389.7,178.0 398.2,178.0 406.7,178.0 415.1,178.0 423.6,178.0 432.1,178.0 440.5,178.0 449.0,178.0 457.5,178.0 465.9,178.0 474.4,178.0 482.9,178.0 491.3,178.0 499.8,178.0 508.3,178.0 516.7,178.0 525.2,178.0 533.7,178.0 542.1,178.0 550.6,178.0 559.1,178.0 567.5,178.0 576.0,178.0 584.5,178.0 592.9,178.0 601.4,178.0 609.9,178.0 618.3,178.0 626.8,178.0 635.3,178.0 643.7,178.0 652.2,178.0 660.7,178.0 669.1,178.0 677.6,178.0 686.1,178.0 694.5,178.0 703.0,178.0 711.5,178.0 719.9,178.0 728.4,178.0 736.9,178.0 745.3,178.0 753.8,174.2 762.3,178.0 770.7,178.0 779.2,178.0 787.7,178.0 796.1,174.2 804.6,151.3 813.1,132.2 821.5,94.0 830.0,151.3"
    fill="none" stroke="url(#lineGrad)" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== Data point markers (dynamic) ===== -->
  <g>
    <circle class="dot" cx="68.0" cy="178.0" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2" style="animation-delay:0.20s"/>
    <circle class="dot" cx="127.3" cy="178.0" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2" style="animation-delay:0.26s"/>
    <circle class="dot" cx="186.5" cy="178.0" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2" style="animation-delay:0.32s"/>
    <circle class="dot" cx="245.8" cy="178.0" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2" style="animation-delay:0.38s"/>
    <circle class="dot" cx="305.1" cy="178.0" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2" style="animation-delay:0.44s"/>
    <circle class="dot" cx="364.3" cy="178.0" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2" style="animation-delay:0.50s"/>
    <circle class="dot" cx="423.6" cy="178.0" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2" style="animation-delay:0.56s"/>
    <circle class="dot" cx="482.9" cy="178.0" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2" style="animation-delay:0.62s"/>
    <circle class="dot" cx="542.1" cy="178.0" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2" style="animation-delay:0.68s"/>
    <circle class="dot" cx="601.4" cy="178.0" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2" style="animation-delay:0.74s"/>
    <circle class="dot" cx="660.7" cy="178.0" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2" style="animation-delay:0.80s"/>
    <circle class="dot" cx="719.9" cy="178.0" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2" style="animation-delay:0.86s"/>
    <circle class="dot" cx="779.2" cy="178.0" r="4" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2" style="animation-delay:0.92s"/>
  </g>

  <!-- ===== Peak accent (dynamic) ===== -->
  <g aria-hidden="true">
    <circle class="peak-halo" cx="821.5" cy="94.0" r="12" fill="url(#glowIndigo)"/>
    <circle class="peak" cx="821.5" cy="94.0" r="5.5" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- ===== X-axis labels (dynamic) ===== -->
  <text class="t tick" x="68.0" y="196" text-anchor="middle">06-14</text>
  <text class="t tick" x="178.1" y="196" text-anchor="middle">06-27</text>
  <text class="t tick" x="288.1" y="196" text-anchor="middle">07-10</text>
  <text class="t tick" x="398.2" y="196" text-anchor="middle">07-23</text>
  <text class="t tick" x="508.3" y="196" text-anchor="middle">08-05</text>
  <text class="t tick" x="618.3" y="196" text-anchor="middle">08-18</text>
  <text class="t tick" x="728.4" y="196" text-anchor="middle">08-31</text>
</svg>