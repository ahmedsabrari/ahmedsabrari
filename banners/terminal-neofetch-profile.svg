<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-labelledby="termTitle termDesc">
  <title id="termTitle">AHMED SABRARI — terminal profile card</title>
  <desc id="termDesc">A neofetch-style terminal panel. User ahmedsabrari@github. Name: AHMED SABRARI. Role: PHP developer. Stars: 7. Repos: 6. Followers: 5. Top language: PHP. Activity: 44 contributions.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F4F1EA"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F1EA"/>
    </linearGradient>

    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4F46E5" stop-opacity="0.70"/>
      <stop offset="55%"  stop-color="#8B93A7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowIndigo">
      <stop offset="0%"   stop-color="#4F46E5" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowTeal">
      <stop offset="0%"   stop-color="#14B8A6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .t { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }

    .title-text  { font-size: 12.5px; font-weight: 500; fill: #6B7280; }
    .logo        { font-size: 13.5px; font-weight: 500; fill: #4F46E5; }
    .handle-name { font-size: 14.5px; font-weight: 800; fill: #1F2933; }
    .handle-at   { font-size: 14.5px; font-weight: 400; fill: #6B7280; }
    .label       { font-size: 13.5px; font-weight: 700; fill: #4F46E5; }
    .value       { font-size: 13.5px; font-weight: 400; fill: #1F2933; }

    .tcur { animation: t-blink 1.1s step-end infinite; }
    .tln  { opacity: 0; animation: t-in 380ms ease-out forwards; }

    .orb-a { transform-box: fill-box; transform-origin: center; animation: drift1 11s ease-in-out infinite; }
    .orb-b { transform-box: fill-box; transform-origin: center; animation: drift2 13s ease-in-out infinite; }
    .dot-1 { transform-box: fill-box; transform-origin: center; animation: pulse 3.4s ease-in-out infinite; }
    .dot-2 { transform-box: fill-box; transform-origin: center; animation: pulse 3.4s ease-in-out .5s infinite; }
    .dot-3 { transform-box: fill-box; transform-origin: center; animation: pulse 3.4s ease-in-out 1s infinite; }

    @keyframes t-blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes t-in    { to { opacity: 1; } }
    @keyframes drift1  { 0%,100% { transform: translate(0,0); } 50% { transform: translate(22px,-12px); } }
    @keyframes drift2  { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-18px,10px); } }
    @keyframes pulse   { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }

    @media (prefers-reduced-motion: reduce) {
      .tcur, .tln, .orb-a, .orb-b, .dot-1, .dot-2, .dot-3 { animation: none !important; }
      .tln { opacity: 1; }
    }
  </style>

  <!-- ===== Canvas ===== -->
  <rect width="860" height="300" rx="20" fill="url(#bgGrad)"/>

  <!-- ===== Decorative glow orbs ===== -->
  <g aria-hidden="true">
    <circle class="orb-a" cx="180" cy="70"  r="60" fill="url(#glowIndigo)"/>
    <circle class="orb-b" cx="700" cy="240" r="70" fill="url(#glowTeal)"/>
  </g>

  <!-- ===== Terminal card ===== -->
  <rect x="26" y="26" width="808" height="248" rx="14"
        fill="#FFFFFF" stroke="#D9D2C7" stroke-width="1.2"/>

  <!-- Title bar -->
  <path d="M26 40 a14 14 0 0 1 14 -14 h780 a14 14 0 0 1 14 14 v24 h-808 z" fill="#FAF8F4"/>
  <rect x="26" y="64" width="808" height="1" fill="#D9D2C7"/>

  <!-- Traffic dots -->
  <circle class="dot-1" cx="52" cy="45" r="6" fill="#ff5f56"/>
  <circle class="dot-2" cx="74" cy="45" r="6" fill="#ffbd2e"/>
  <circle class="dot-3" cx="96" cy="45" r="6" fill="#27c93f"/>

  <!-- Window title -->
  <text class="t title-text" x="430" y="50" text-anchor="middle">ahmedsabrari@github: ~$ neofetch</text>

  <!-- Decorative shine -->
  <path aria-hidden="true" d="M120 88 C 220 74, 320 74, 420 88"
        fill="none" stroke="url(#shineGrad)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ===== Left: ASCII logo ===== -->
  <g class="t logo tln" style="animation-delay: 0.05s" xml:space="preserve">
    <text x="62" y="128" xml:space="preserve"> ╭──────────╮</text>
    <text x="62" y="148" xml:space="preserve"> │  ▄▄  ▄▄  │</text>
    <text x="62" y="168" xml:space="preserve"> │  · github│</text>
    <text x="62" y="188" xml:space="preserve"> │  &gt; _     │</text>
    <text x="62" y="208" xml:space="preserve"> ╰──────────╯</text>
  </g>

  <!-- ===== Right: identity header ===== -->
  <g class="tln" style="animation-delay: 0.15s">
    <text class="t handle-name" x="280" y="100">ahmedsabrari</text>
    <text class="t handle-at"   x="392" y="100">@github</text>
    <line x1="280" y1="112" x2="560" y2="112" stroke="#D9D2C7" stroke-width="1"/>
  </g>

  <!-- ===== Right: stats rows ===== -->
  <g class="tln" style="animation-delay: 0.28s">
    <text class="t label" x="280" y="128">Name</text>
    <text class="t value" x="390" y="128">AHMED SABRARI</text>
  </g>
  <g class="tln" style="animation-delay: 0.36s">
    <text class="t label" x="280" y="148">Role</text>
    <text class="t value" x="390" y="148">PHP developer</text>
  </g>
  <g class="tln" style="animation-delay: 0.44s">
    <text class="t label" x="280" y="168">Stars</text>
    <text class="t value" x="390" y="168">7</text>
  </g>
  <g class="tln" style="animation-delay: 0.52s">
    <text class="t label" x="280" y="188">Repos</text>
    <text class="t value" x="390" y="188">6</text>
  </g>
  <g class="tln" style="animation-delay: 0.60s">
    <text class="t label" x="280" y="208">Followers</text>
    <text class="t value" x="390" y="208">5</text>
  </g>
  <g class="tln" style="animation-delay: 0.68s">
    <text class="t label" x="280" y="228">Top Lang</text>
    <text class="t value" x="390" y="228">PHP</text>
  </g>
  <g class="tln" style="animation-delay: 0.76s">
    <text class="t label" x="280" y="248">Activity</text>
    <text class="t value" x="390" y="248">44 contributions</text>
  </g>

  <!-- ===== Swatches ===== -->
  <g class="tln" style="animation-delay: 0.90s" aria-hidden="true">
    <rect x="280" y="258" width="22" height="9" rx="2" fill="#4F46E5"/>
    <rect x="306" y="258" width="22" height="9" rx="2" fill="#6366F1"/>
    <rect x="332" y="258" width="22" height="9" rx="2" fill="#818CF8"/>
    <rect x="358" y="258" width="22" height="9" rx="2" fill="#14B8A6"/>
    <rect x="384" y="258" width="22" height="9" rx="2" fill="#2DD4BF"/>
    <rect x="410" y="258" width="22" height="9" rx="2" fill="#5EEAD4"/>
  </g>

  <!-- ===== Blinking cursor ===== -->
  <rect class="tcur" x="524" y="236" width="8" height="14" fill="#4F46E5" aria-hidden="true"/>
</svg>